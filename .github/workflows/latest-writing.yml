# Keeps the "Latest writing" list in README.md in sync with the blog's RSS feed.
name: Latest writing

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: "https://azlanmalik.com/rss.xml"
          max_post_count: 5
          commit_message: "Update latest writing"
          committer_username: "AzlanMalik"
